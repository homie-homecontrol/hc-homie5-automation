---
# Office smart thermostat. The Matter TRV (Eurotronic) has no schedule, window, boost or external
# sensor support; this virtual device adds them in the shape of the Homematic thermostats, so the
# dashboard heating widgets and the season switching work unchanged. smart_heating.lua controls the
# TRV (matter-5489-227-5fdb7d425dda566c) from it, using the room sensor leq1258226 as the reference.
id: bue-thermostat
name: Buero Thermostat
nodes:
  - id: thermostat
    name: Thermostat
    type: hc-smarthome/v2/cap/thermostat
    pass_through: true
    property_opts:
      read_from_mqtt: true
      read_timeout: 1000ms
    properties:
      # Room target temperature: schedule point, manual override or manual mode value.
      - id: set-temperature
        name: Target temperature
        datatype: float
        format: "7.5:28.5:0.5"
        unit: "°C"
        settable: true
        retained: true
      - id: mode
        name: Mode
        datatype: enum
        format: "off,auto,manual"
        settable: true
        retained: true
      - id: valve
        name: Valve position
        datatype: integer
        format: "0:100"
        unit: "%"
        retained: true
        compound_spec:
          members:
            - matter-5489-227-5fdb7d425dda566c/thermostat/valve
      - id: window-open
        name: Window open
        datatype: boolean
        format: "closed,open"
        retained: true
      - id: boost-state
        name: Boost
        datatype: boolean
        settable: true
        retained: true
      - id: boost-end
        name: Boost end
        datatype: datetime
        retained: true
      - id: boost-duration
        name: Boost duration
        datatype: integer
        format: "0:"
        unit: s
        retained: true
  - id: climate
    name: Climate sensor
    type: hc-smarthome/v2/cap/climate
    properties:
      - id: temperature
        name: Current temperature
        datatype: float
        unit: "°C"
        retained: true
        compound_spec:
          members:
            - leq1258226/climate/temperature
      - id: humidity
        name: Humidity
        datatype: integer
        format: "0:100"
        unit: "%"
        retained: true
        compound_spec:
          members:
            - leq1258226/climate/humidity
  - id: thermostat-schedule
    name: Thermostat schedule
    type: hc-smarthome/v2/ext/thermostat-schedule
    pass_through: true
    property_opts:
      read_from_mqtt: true
      read_timeout: 1000ms
    properties:
      - id: active-profile
        name: Active week profile
        datatype: integer
        format: "1:3"
        settable: true
        retained: true
      - id: profile-1
        name: Week profile 1
        datatype: json
        format: &profile_format "{\"$schema\":\"http://json-schema.org/draft-07/schema#\",\"type\":\"object\",\"additionalProperties\":false,\"required\":[\"monday\",\"tuesday\",\"wednesday\",\"thursday\",\"friday\",\"saturday\",\"sunday\"],\"properties\":{\"monday\":{\"$ref\":\"#/definitions/day\"},\"tuesday\":{\"$ref\":\"#/definitions/day\"},\"wednesday\":{\"$ref\":\"#/definitions/day\"},\"thursday\":{\"$ref\":\"#/definitions/day\"},\"friday\":{\"$ref\":\"#/definitions/day\"},\"saturday\":{\"$ref\":\"#/definitions/day\"},\"sunday\":{\"$ref\":\"#/definitions/day\"}},\"definitions\":{\"day\":{\"type\":\"array\",\"minItems\":1,\"maxItems\":13,\"items\":{\"type\":\"object\",\"additionalProperties\":false,\"required\":[\"until\",\"temperature\"],\"properties\":{\"until\":{\"type\":\"string\",\"pattern\":\"^(([01][0-9]|2[0-3]):[0-5][05]|24:00)$\"},\"temperature\":{\"type\":\"number\",\"minimum\":5.0,\"maximum\":30.0,\"multipleOf\":0.5}}}}}}"
        settable: true
        retained: true
      - id: profile-2
        name: Week profile 2
        datatype: json
        format: *profile_format
        settable: true
        retained: true
      - id: profile-3
        name: Week profile 3
        datatype: json
        format: *profile_format
        settable: true
        retained: true
  - id: thermostat-settings
    name: Thermostat settings
    type: hc-smarthome/v2/ext/thermostat-settings
    pass_through: true
    property_opts:
      read_from_mqtt: true
      read_timeout: 1000ms
    properties:
      - id: boost-after-window-open
        name: Boost after window open
        datatype: boolean
        settable: true
        retained: true
      - id: boost-duration
        name: Boost duration
        datatype: integer
        format: "0:30:5"
        unit: min
        settable: true
        retained: true
      - id: window-open-temperature
        name: Window open temperature
        datatype: float
        format: "7.5:28.5:0.5"
        unit: "°C"
        settable: true
        retained: true
