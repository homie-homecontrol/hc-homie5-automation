[package]
name = "hc-homie5-automation"
version = "0.0.0-placeholder"
edition = "2021"

[workspace.metadata.rustfmt]
config = "rustfmt.toml"

[dependencies]
color-eyre = "0.6.3"
reqwest = {version = "0.13.2", features = ["json", "form"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.1"
tokio = { version = "1.41.0", features = ["full"] }
tracing = "0.1"
rand = "0.10.0"
rumqttc = "0.25.0"
tokio-util = "0.7.9"
serde_yaml_ng = "0.10.0"
chrono = "0.4.39"
mlua = { version = "0.11.5", features = ["async", "lua54", "macros", "serialize", "vendored"] }
cron = { version = "0.16.0", features = ["serde"] }
sun = "0.3.1"
once_cell = "1.20.2"
config_watcher = "0.12.1"
homie5 = { version = "0.13", features = ["ext-meta"] }
hc-homie5-smarthome = { version = "0.12" }
hc-homie5 = { version = "0.15", features = ["ext-meta", "logging"] }
simple_kv_store = { version = "0.3.0" }
regex = "1.11.1"

[dev-dependencies]
tokio = { version = "1.41.0", features = ["full", "test-util"] }
chrono-tz = "0.10"

[[bin]]
name = "hc-homie5-automation"
path = "src/bin/hc-homie5-automation/main.rs"

